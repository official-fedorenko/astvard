# Production nginx for astvard.online. Replaces the placeholder vhost.
#
# Everything goes to the backend, static files included: node:http already serves
# frontend/ with a path check, so proxying keeps one source of truth instead of a
# second copy of the pages under /var/www. It also rules out the trap the
# placeholder config fell into — `try_files $uri $uri/ /index.html` answered every
# /api/... with the HTML page and code 200, which is worse than a 404: a frontend
# fetch got a success carrying HTML where it expected JSON.
#
# The certbot-managed lines are kept verbatim; the certificate already exists.

server {
    server_name astvard.online;
    include snippets/astvard-gzip.conf;

    # The whitelist files are plain text and small; everything else is a page or a
    # JSON answer. Nothing here is big enough to need a body-size bump.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # The backend builds no absolute URLs from Host — APP_URL is configured, on
        # purpose, because a header is written by whoever is calling. These are for
        # logs and for whatever needs them later.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The Steam return is a redirect the player's browser follows, so nothing
        # here streams or hangs; short timeouts surface a dead backend as 504 fast.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/astvard.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/astvard.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# www.astvard.online is the same site under a second name, and to a search engine
# two names are two copies of every page competing with each other. Both lead to
# the one address the site gives as canonical (APP_URL). The certificate already
# lists www; the ssl lines repeat the ones certbot manages above.
server {
    server_name www.astvard.online;
    return 301 https://astvard.online$request_uri;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/astvard.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astvard.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Plain HTTP goes to the canonical address in one hop, www or not; before, www went
# to https://www first and only then anywhere.
server {
    listen 80;
    server_name astvard.online www.astvard.online;
    return 301 https://astvard.online$request_uri;
}
