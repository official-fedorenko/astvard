<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<!-- The mark edge to edge on a transparent page: the favicon sits on whatever the
     browser tab or the search result puts behind it. The window size of the shot
     is the icon size. -->
<style>
  html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:transparent}
  img{display:block;width:100%;height:100%}
</style></head><body>
  <img src="../../client/img/astvard-mark.svg" alt="">
</body></html>
