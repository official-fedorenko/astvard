<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<!-- The mark on the site's own dark ground, with room around it. iOS paints a
     transparent home-screen icon black and Android crops launcher icons into a
     circle, so these must be opaque and must not reach the edge. -->
<style>
  html,body{margin:0;width:100vw;height:100vh;overflow:hidden}
  body{background:radial-gradient(circle at 50% 40%,#1b1036 0%,#030307 72%);
       display:flex;align-items:center;justify-content:center}
  img{display:block;width:70%;height:70%}
</style></head><body>
  <img src="../../client/img/astvard-mark.svg" alt="">
</body></html>
