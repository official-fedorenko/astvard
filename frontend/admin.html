<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Админка — Astvard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1><a href="/">Astvard</a></h1>
    <nav><a href="/cabinet.html">Кабинет</a></nav>
  </header>
  <main>
    <section>
      <h2>Пользователи</h2>
      <table id="users-table">
        <thead>
          <tr><th>Никнейм</th><th>Email</th><th>Роль</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section>
      <h2>Серверы</h2>
      <form id="add-server-form" class="inline-form">
        <input type="text" name="name" placeholder="Название" required>
        <input type="text" name="host" placeholder="Хост/IP" required>
        <input type="number" name="port" placeholder="Порт" required>
        <button type="submit">Добавить</button>
      </form>
      <button id="refresh-btn">Обновить статус</button>
      <table id="servers-table">
        <thead>
          <tr><th>Название</th><th>Адрес</th><th>Статус</th><th>Игроки</th><th>Проверен</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script src="/common.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
