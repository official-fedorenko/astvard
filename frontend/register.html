<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Регистрация — Astvard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Регистрация</h1>

  <form id="register-form">
    <label>
      Ник
      <input type="text" id="nickname" minlength="3" maxlength="20" pattern="[a-zA-Z0-9_-]+" required>
    </label>

    <label>
      Имя
      <input type="text" id="firstName" required>
    </label>

    <label>
      Фамилия
      <input type="text" id="lastName" required>
    </label>

    <label>
      Email
      <input type="email" id="email" required>
    </label>

    <label>
      Пароль (минимум 8 символов)
      <input type="password" id="password" minlength="8" required>
    </label>

    <label>
      Повтор пароля
      <input type="password" id="passwordConfirm" minlength="8" required>
    </label>

    <!-- honeypot: скрыто от людей стилями, боты часто заполняют все поля подряд -->
    <label class="honeypot" aria-hidden="true">
      Website
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </label>

    <button type="submit">Зарегистрироваться</button>
  </form>

  <p id="message"></p>

  <script src="register.js"></script>
</body>
</html>
