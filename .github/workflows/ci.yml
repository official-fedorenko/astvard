name: CI

on:
  push:
    branches: [valheim-mod, main]
  pull_request:
    branches: [valheim-mod, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    # Тестам нужна настоящая база: панель переехала со SQLite на Postgres, и
    # проверять её на чём-то другом значит проверять не то, что работает на VPS.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astvard
          POSTGRES_PASSWORD: astvard_ci
          POSTGRES_DB: astvard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astvard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: astvard
      POSTGRES_PASSWORD: astvard_ci
      POSTGRES_TEST_DB: astvard_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci
      - run: npm test
