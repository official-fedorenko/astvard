<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Astvard">
  <defs>
    <linearGradient id="astvardMarkFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a2be2"/>
      <stop offset="1" stop-color="#00d2ff"/>
    </linearGradient>
    <!-- The facet fades out instead of ending on a line: a hard edge at the shield's
         widest point read as two stacked shapes rather than one faceted solid. -->
    <linearGradient id="astvardMarkFacet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Shield, letter and counter in one path. Even-odd punches the A clean
         through, so the mark carries its own background wherever it is placed.
         The letter is kept inside the shield's taper: at y=66 the shield spans
         x 28.1-71.9, the legs stop at 32 and 68. -->
    <clipPath id="astvardMarkClip">
      <path clip-rule="evenodd" d="
        M50 5 L93 36 L50 97 L7 36 Z
        M47 24 L53 24 L68 66 L60.5 66 L57.1 56.5 L42.9 56.5 L39.5 66 L32 66 Z
        M50 36.6 L54.8 50 L45.2 50 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#astvardMarkClip)">
    <rect width="100" height="100" fill="url(#astvardMarkFill)"/>
    <path d="M50 5 L93 36 L7 36 Z" fill="url(#astvardMarkFacet)"/>
  </g>
</svg>
