<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astvard — в разработке</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #0b0b0f;
    color: #e8e6f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    text-align: center;
    max-width: 480px;
  }
  .rune {
    font-size: 56px;
    margin-bottom: 8px;
    opacity: 0.9;
  }
  h1 {
    font-size: 28px;
    margin: 0 0 12px;
    letter-spacing: 0.02em;
  }
  p {
    color: #a8a5b8;
    font-size: 16px;
    line-height: 1.6;
    margin: 0;
  }
  .bar {
    width: 100%;
    height: 3px;
    background: #201f2b;
    border-radius: 3px;
    margin: 32px 0;
    overflow: hidden;
  }
  .bar::after {
    content: "";
    display: block;
    width: 40%;
    height: 100%;
    background: linear-gradient(90deg, transparent, #8b7cf6, transparent);
    animation: slide 1.6s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="rune">ᛅ</div>
    <h1>Astvard в разработке</h1>
    <div class="bar"></div>
    <p>Мы пересобираем проект с нуля.<br>Скоро всё заработает снова.</p>
  </div>
</body>
</html>
