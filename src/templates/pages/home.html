      <!-- HERO -->
      <section class="hero" id="home">
        <div class="hero__badge">
          <i data-lucide="sparkles" style="width: 14px; height: 14px; color: var(--accent-cyan);"></i> 
          Сервер Valheim · вход через Steam
        </div>
        <h1 class="hero__title" id="heroTitle">{{hero_title}}</h1>
        <p class="hero__subtitle" id="heroSubtitle">{{site_description}}</p>
        <div class="hero__actions">
          <a href="/api/auth/steam" rel="nofollow" class="btn btn--primary" id="heroRegisterBtn">Войти через Steam</a>
          <a href="#servers-section" class="btn btn--ghost">Наши серверы</a>
        </div>
      </section>

      <!-- SERVERS -->
      <section class="section" id="servers-section">
        <h2 class="section__title">Игровые серверы</h2>
        <div class="articles-grid" id="serversGrid">
          <p style="color: var(--text-muted, #a0a0ab);">Загрузка...</p>
        </div>
      </section>

      <!-- Свежие новости: три штуки, остальное — на своей странице -->
      <section class="section" id="latest">
        <h2 class="section__title">Свежее</h2>
        <p class="section__subtitle">Последние записи — <a class="text-link" href="/news">все новости</a></p>
        <div class="articles-grid">{{{latest_articles}}}
        </div>
      </section>
