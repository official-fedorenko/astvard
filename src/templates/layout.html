<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Title, description, canonical, link previews, icons and schema.org come from
       src/seo.js, and so does every double-brace field below: the page leaves the server
       finished, so a search engine or a messenger that runs no scripts reads the
       real texts instead of placeholders. -->
  {{{head}}}

  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Pinned: @latest is a redirect on every visit, and a new release may rename an
       icon overnight. Deferred: it was the one script holding back the first paint. -->
  <script src="https://unpkg.com/lucide@1.45.0/dist/umd/lucide.min.js" defer></script>
  <style>
    /* На мобильных чип пользователя открывает меню; отдельную кнопку
       «Панель» прячем — админ-панель доступна пунктом меню. */
    #navUserCaret { display: none; }
    .guest-mobile-only { display: none; }
    @media (max-width: 768px) {
      #authNav #navAdminPanel { display: none !important; }
      #cabinetLink { cursor: pointer; }
      #navUserCaret { display: inline-flex; align-items: center; }
      /* Гость: две ссылки → одна кнопка «Вход» с модалкой */
      .guest-desktop-only { display: none !important; }
      .guest-mobile-only { display: inline-flex; align-items: center; gap: 6px; }
    }
    .profile-menu-overlay {
      display: none; position: fixed; inset: 0; z-index: 2000;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(3px);
      align-items: flex-start; justify-content: center;
    }
    .profile-menu-overlay.open { display: flex; }
    .profile-menu {
      margin-top: 64px; width: min(340px, 92vw);
      background: #17171f; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.5);
      animation: pmIn .16s ease;
    }
    @keyframes pmIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
    .profile-menu-head {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 18px; border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .profile-menu-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, #8a2be2, #00d2ff);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px; color: #fff; flex-shrink: 0;
    }
    .profile-menu-name { font-weight: 700; color: #f2f2f7; font-size: 15px; }
    .profile-menu-role { font-size: 12px; color: #a0a0ab; }
    .profile-menu-item {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 14px 18px; background: none; border: none; cursor: pointer;
      color: #f2f2f7; font-size: 15px; font-family: 'Inter', sans-serif;
      text-align: left; text-decoration: none; transition: background 0.15s;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .profile-menu-item:last-child { border-bottom: none; }
    .profile-menu-item:hover { background: rgba(255,255,255,0.05); }
    .profile-menu-item i { width: 18px; height: 18px; flex-shrink: 0; color: #a0a0ab; }
    .profile-menu-item.danger { color: #ff4a6e; }
    .profile-menu-item.danger i { color: #ff4a6e; }
  </style>
</head>
<body>
  
  <div class="blob-bg"></div>
  <div class="blob-bg blob-2"></div>

  <!-- TOP HEADER BAR -->
  <header class="topbar">
    <a href="/" class="topbar__brand">
      <div class="topbar__icon">
        <img src="/img/astvard-mark.svg" alt="" width="34" height="34">
      </div>
      <span class="topbar__name"><strong id="siteName">{{site_name}}</strong></span>
    </a>
    
    <div class="topbar__right">
      <!-- Guest links (shown when not logged in) -->
      <div id="guestNav" style="display:flex;align-items:center;gap:16px;">
        <a href="/login.html" class="admin-link guest-desktop-only">Войти <i data-lucide="arrow-right"></i></a>
        <button type="button" id="guestMenuBtn" class="admin-link guest-mobile-only" style="cursor:pointer;font-family:inherit;">Аккаунт <i data-lucide="chevron-down" style="width:14px;height:14px;"></i></button>
      </div>
      <!-- Auth links (shown when logged in) -->
      <div id="authNav" style="display:none;align-items:center;gap:12px;">
        <a href="/cabinet.html" class="admin-link" id="cabinetLink">
          <i data-lucide="user"></i>
          <span id="navUsername">Кабинет</span>
          <span id="navUserCaret"><i data-lucide="chevron-down" style="width:14px;height:14px;"></i></span>
        </a>
      </div>
    </div>
  </header>

  <!-- Мобильное меню входа/регистрации (гость) -->
  <div class="profile-menu-overlay" id="guestMenuOverlay">
    <div class="profile-menu" role="menu" aria-label="Вход">
      <a href="/login.html" class="profile-menu-item" role="menuitem"><i data-lucide="log-in"></i> Войти</a>
    </div>
  </div>

  <!-- Мобильное меню профиля (тап по нику в шапке) -->
  <div class="profile-menu-overlay" id="profileMenuOverlay">
    <div class="profile-menu" role="menu" aria-label="Меню профиля">
      <div class="profile-menu-head">
        <div class="profile-menu-avatar" id="pmAvatar">?</div>
        <div>
          <div class="profile-menu-name" id="pmName">...</div>
          <div class="profile-menu-role" id="pmRole"></div>
        </div>
      </div>
      <a href="/" class="profile-menu-item" role="menuitem"><i data-lucide="home"></i> На сайт</a>
      <a href="/admin/" class="profile-menu-item" role="menuitem" id="pmAdmin" style="display:none;"><i data-lucide="settings"></i> Админ-панель</a>
      <a href="/cabinet.html" class="profile-menu-item" role="menuitem"><i data-lucide="user"></i> Профиль</a>
      <button type="button" class="profile-menu-item danger" role="menuitem" id="pmLogout"><i data-lucide="log-out"></i> Выход</button>
    </div>
  </div>

  <div class="layout">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar__nav">
        <p class="sidebar__section-label">Разделы</p>
{{{nav}}}

        <div id="sidebarRegisterBlock">
          <p class="sidebar__section-label">Активность</p>
          <ul class="sidebar__menu">
            <li>
              <a href="/api/auth/steam" rel="nofollow" class="sidebar__link">
                <span class="sidebar__link-icon"><i data-lucide="log-in"></i></span>
                <span>Войти через Steam</span>
              </a>
            </li>
          </ul>
        </div>
      </nav>
    </aside>

    <!-- SIDEBAR TOGGLE FOR MOBILE -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle navigation">
      <i data-lucide="menu" id="toggleIcon"></i>
    </button>

    <!-- CONTENT AREA -->
    <main class="content">
{{{content}}}
    </main>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer__inner">
      <span class="footer__copy">&copy; <span id="currentYear">{{year}}</span> <span id="footerSiteName">{{site_name}}</span>. Все права защищены.</span>
      {{{community_links}}}
    </div>
  </footer>

  <script src="/app.js"></script>
  <script>
    // Гостевое меню входа/регистрации (мобильные)
    (function () {
      const btn = document.getElementById('guestMenuBtn');
      const overlay = document.getElementById('guestMenuOverlay');
      if (!btn || !overlay) return;
      btn.addEventListener('click', () => overlay.classList.add('open'));
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') overlay.classList.remove('open'); });
    })();

    // Сайдбар тогглер
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const toggleIcon = document.getElementById('toggleIcon');
    
    sidebarToggle.addEventListener('click', (e) => {
      e.stopPropagation(); // не даём этому же клику сразу закрыть меню обработчиком ниже
      sidebar.classList.toggle('open');
      const isOpen = sidebar.classList.contains('open');
      toggleIcon.setAttribute('data-lucide', isOpen ? 'x' : 'menu');
      lucide.createIcons();
    });

    // Клик вне открытого мобильного меню (и не по самой кнопке-бургеру) — закрывает его.
    document.addEventListener('click', (e) => {
      if (!sidebar.classList.contains('open')) return;
      if (sidebar.contains(e.target) || sidebarToggle.contains(e.target)) return;
      sidebar.classList.remove('open');
      toggleIcon.setAttribute('data-lucide', 'menu');
      lucide.createIcons();
    });

    // Навигация (fixed: reliable active state + smooth scroll to sections)
    function switchSection(id) {
      const links = document.querySelectorAll('.sidebar__link');
      links.forEach(l => l.classList.remove('active'));

      // Activate matching link by href (more reliable than event.currentTarget in onclick)
      const targetHref = '#' + id;
      const activeLink = Array.from(links).find(l =>
        l.getAttribute('href') === targetHref ||
        l.getAttribute('href') === targetHref + '-section'
      );
      if (activeLink) {
        activeLink.classList.add('active');
      }

      // Smooth scroll to section
      const section = document.getElementById(id);
      if (section) {
        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      sidebar.classList.remove('open');
      toggleIcon.setAttribute('data-lucide', 'menu');
      lucide.createIcons();
    }
  </script>
    </div>
  </div>
{{{scripts}}}
</body>
</html>
