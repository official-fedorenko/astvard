services:
  postgres:
    image: postgres:16
    container_name: astvard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: astvard
      POSTGRES_PASSWORD: astvard_dev
      POSTGRES_DB: astvard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
